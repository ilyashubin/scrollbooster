<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScrollBooster images</title>
    <style>.strip img{border-radius:8px;height:200px;display:block}</style>
  <script type="module" crossorigin src="./assets/images-DnoDSyQm.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/scroll-booster-C3eI9fs7.js">
  <link rel="modulepreload" crossorigin href="./assets/demo-BuffhXw6.js">
  <link rel="stylesheet" crossorigin href="./assets/demo-DzoleO6o.css">
</head>
<body>
<main>
    <h1>Images</h1>
    <p class="hint">
        Images without size attributes load one by one with a delay and widen the strip. Content size and
        <code>maxPosition</code> follow without <code>updateMetrics()</code>: the viewport and content are watched
        with <code>ResizeObserver</code>. Resize the window to change the viewport.
    </p>
    <div class="toolbar">
        <button type="button" id="reload">Load images again</button>
        <button type="button" id="add">Add 3 images</button>
        <button type="button" id="end">scrollTo end</button>
    </div>
    <div class="stage">
        <section class="viewport" id="gallery" tabindex="0" aria-label="Images">
            <div class="strip"></div>
        </section>
        <div id="panel"></div>
    </div>
</main>
</body>
</html>
